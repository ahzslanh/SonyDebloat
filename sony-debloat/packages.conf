OPTIONAL	com.google.android.youtube.tv.recommendations	YouTube TV recommendation feed
OPTIONAL	com.google.android.katniss	Google Cast / Assistant (loses casting)
OPTIONAL	com.android.vending	Play Store (loses app install + app updates)
