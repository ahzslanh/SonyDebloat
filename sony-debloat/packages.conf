# Sony BRAVIA VU1 (Google TV / Android 11) debloat package list
# tier<TAB>package<TAB>note
#
# tiers:
#   CORE     = zero user-visible loss on a TV, pure waste. Safe to disable.
#   OPTIONAL = drops a feature; enable only if you truly do not use it.
#
# Never disable: com.google.android.gms, com.google.android.gsf, com.android.vending,
#   com.google.android.katniss (Cast/Assistant), com.google.android.apps.mediashell,
#   com.google.android.tvlauncher, com.google.android.tvrecommendations,
#   com.android.systemui, com.android.tv.settings, com.android.tv (LiveTv),
#   com.sony.dtv.smartui, com.sony.dtv.remotecontrolsettings, com.sony.dtv.ime.chww,
#   com.sony.dtv.ipcontrol*, com.android.bluetooth, DRM / Widevine providers.

CORE	com.google.android.syncadapters.calendar	120MB RSS - calendar sync on a TV
CORE	com.android.providers.calendar	63MB RSS - calendar provider
CORE	com.google.android.tungsten.setupwraith	84MB RSS - setup wizard leftover
CORE	com.google.android.partnersetup	55MB RSS - setup wizard partner
CORE	com.google.android.onetimeinitializer	one-time initializer, long done
CORE	com.google.android.feedback	Google feedback uploader
CORE	com.android.backupconfirm	TV backup/restore confirm UI
CORE	com.android.captiveportallogin	captive portal helper
CORE	com.android.printspooler	no printer on a TV
CORE	com.android.cts.ctsshim	CTS compliance shim
CORE	com.android.cts.priv.ctsshim	CTS compliance shim
CORE	com.sony.dtv.helpguidecontents	iManual (70MB+ of PDFs)
CORE	com.sony.dtv.smarthelp	Sony smart help
CORE	com.sony.dtv.eulaviewer	Sony EULA viewer
CORE	com.sony.dtv.demo	Demo / retail mode app
CORE	com.android.dreams.basic	basic screensaver
CORE	com.android.wallpaper.livepicker	live wallpaper picker
CORE	com.android.wallpaperbackup	wallpaper backup
OPTIONAL	com.google.android.backdrop	ambient mode wallpaper engine
